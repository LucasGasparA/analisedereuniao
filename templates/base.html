<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#352048">
  <title>{% block title %}Next Fit | Análise de reuniões{% endblock %}</title>
  <link rel="icon" href="/static/fantasma-favicon.svg?v=1" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css?v=7">
  <script src="/static/app.js?v=7" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="shell nav">
      <a href="/" class="brand" aria-label="Next Fit Análise de reuniões">
        <img src="/static/fantasma-branco.svg" alt="" class="brand-mark" aria-hidden="true">
        <span class="brand-copy"><b>Next Fit</b><small>Análise de reuniões</small></span>
      </a>
      {% if logged %}
      <div class="nav-actions">
        <span class="environment-dot"><i></i> Ambiente local</span>
        <form method="post" action="/logout">
          <input type="hidden" name="token" value="{{ csrf }}">
          <button class="nav-button" type="submit">Sair</button>
        </form>
      </div>
      {% endif %}
    </div>
  </header>

  <main class="shell page-content">{% block content %}{% endblock %}</main>

  <footer class="shell footer">
    <span class="footer-brand"><img src="/static/fantasma-roxo.svg" alt="" aria-hidden="true"> Next Fit · Análise de reuniões</span>
    <span>Uso interno e confidencial</span>
  </footer>
</body>
</html>
